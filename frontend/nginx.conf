worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;

    # Large BloodHound/SharpHound uploads can exceed 64MB after base64 overhead
    client_max_body_size 128m;

    # LLM analysis can take 10+ minutes on larger graphs
    proxy_read_timeout    1800s;
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;

    gzip on;
    # text/html is always gzipped by nginx and must not be listed here.
    gzip_types text/plain text/css application/javascript application/json;

    # $server_port is the only thing that distinguishes a dashboard request from
    # an n8n-editor or graph-app one: all three server blocks share this log, and
    # several paths (/healthz, /) exist on more than one of them. Without the port
    # a misrouted forwarded port is indistinguishable from a normal request, which
    # is precisely the bug this format was added to make visible.
    log_format spotter '$remote_addr :$server_port - $remote_user [$time_local] '
                       '"$request" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log spotter;

    # The Brute Ratel ingress on :8099 must NOT use the format above. Its shared
    # secret can only ride the URL's query string (BRc4's webhook dialog has one
    # URL field and no header controls), and $request logs a query string
    # verbatim -- so every badger check-in would write one cleartext copy of the
    # token into a docker json log that nothing rotates.
    #
    # $uri is the path alone. The token is reduced to present/absent, which is
    # the one thing the log needs to answer: BRc4's webhook dialog is documented
    # only in a manual screenshot showing a bare scheme://host:port, so whether
    # Commander preserves ?t= is otherwise unknowable without printing the
    # secret. token=absent on a real badger check-in means it stripped it.
    map $arg_t $brc4_token {
        ""      "absent";
        default "present";
    }

    log_format brc4 '$remote_addr :$server_port - [$time_local] '
                    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                    'token=$brc4_token "$http_user_agent"';

    # CORS allowlist: reflect the Origin only for the local dashboard origin.
    # Any other origin gets an empty value → browsers block the cross-origin call.
    # (Same-origin requests from the served page don't consult this header.)
    # The literal hostname:port below is substituted at container start by the
    # envsubst entrypoint (NGINX_ENVSUBST_FILTER in docker-compose.caddy.yml /
    # docker-compose.frontend.yml is pinned to these two names) -- it must match
    # whatever Caddy's dashboard vhost is (deployment/Caddyfile), since that is
    # the only origin browsers ever load this SPA from now.
    map $http_origin $cors_ok {
        default                        "";
        "~^https://${SPOTTER_DASHBOARD_HOST}:${SPOTTER_CADDY_PORT}$" $http_origin;
    }

    # n8n's editor and the Flowsint app both use websockets for live updates.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # A browser navigation should land on the login page; an XHR from the SPA
    # should get a machine-readable 401 it can act on. Distinguished by Accept.
    map $http_accept $wants_html {
        default        0;
        "~*text/html"  1;
    }

    # Throttle credential stuffing at the edge; the auth service additionally
    # locks an account after SPOTTER_LOGIN_MAX_FAILS failures.
    limit_req_zone $binary_remote_addr zone=spotter_login:1m rate=10r/m;

    # Docker's embedded DNS. Required because every proxy_pass below routes
    # through a VARIABLE, which forces nginx to re-resolve the upstream at
    # request time instead of caching the IP at startup. Without this, any
    # `docker compose up -d n8n` (new container = new IP) leaves nginx proxying
    # to a dead address and every webhook returns 502 until nginx is restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ══════════════════════════════════════════════════════════════════════════
    # :8080 — SPOTTER dashboard (SPA + n8n webhook proxy + tunnel control plane)
    # ══════════════════════════════════════════════════════════════════════════
    server {
        listen 8080;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # ── Authentication gate ───────────────────────────────────────────────
        # Every location below inherits this unless it sets `auth_request off`.
        # The subrequest resolves the session cookie to an operator name, which
        # is then stamped onto the upstream request as X-Spotter-User. Because
        # proxy_set_header ALWAYS overwrites, a client-supplied X-Spotter-User
        # header can never survive — that is what makes the header trustworthy
        # to the n8n code nodes that enforce campaign ownership.
        #
        # X-Spotter-Admin carries the operator's role on the same subrequest and
        # is trustworthy for exactly the same reason. Code nodes gate global
        # writes (the Configuration panel, WF22) on it and fail closed, so an
        # operator cannot grant themselves admin by forging a request header.
        auth_request     /_auth/verify;
        auth_request_set $spotter_user  $upstream_http_x_spotter_user;
        auth_request_set $spotter_admin $upstream_http_x_spotter_admin;

        error_page 401 = @unauthorized;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options        SAMEORIGIN  always;
        add_header Referrer-Policy        no-referrer always;

        location @unauthorized {
            if ($wants_html) {
                # A relative redirect here gets absolutized by nginx using ITS
                # OWN scheme/port (http on :8080), not the browser's actual
                # https://…:5443 via Caddy -- hence the absolute URL, same as
                # the :8081/:8082 blocks below.
                return 302 https://${SPOTTER_DASHBOARD_HOST}:${SPOTTER_CADDY_PORT}/login.html;
            }
            # The 401 needs the CORS headers as much as the 200 does. error_page
            # routes here OUT of /webhook/, so that block's add_header directives
            # never run — and a cross-origin 401 the browser blocks for missing
            # CORS reaches fetch() as an opaque network error, which the SPA then
            # reports as "is the Docker stack running?" instead of bouncing the
            # operator to the login page.
            add_header Access-Control-Allow-Origin      $cors_ok always;
            add_header Access-Control-Allow-Methods     "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers     "Content-Type" always;
            add_header Access-Control-Allow-Credentials "true" always;
            default_type application/json;
            return 401 '{"error":"unauthenticated","login":"/login.html"}';
        }

        location = /_auth/verify {
            internal;
            auth_request off;
            set $auth_up http://spotter-auth:7052;
            proxy_pass              $auth_up/auth/verify;
            proxy_pass_request_body off;
            proxy_set_header        Content-Length "";
            proxy_set_header        X-Original-URI $request_uri;
        }

        # Login / logout / identity. Unauthenticated by necessity.
        location /auth/ {
            auth_request off;
            limit_req zone=spotter_login burst=5 nodelay;
            set $auth_up http://spotter-auth:7052;
            proxy_pass         $auth_up$request_uri;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location = /login.html {
            auth_request off;
        }

        location = /register.html {
            auth_request off;
        }

        location = /healthz {
            auth_request off;
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # ── Gate identity ─────────────────────────────────────────────────────
        # Names WHICH service answers on this port, so the dashboard can tell a
        # correctly forwarded port from one that loops back here. Every port
        # serves this path, each with a different `gate` value.
        #
        # The operator reaches SPOTTER over an SSH / VS Code forward, where the
        # local port numbers need not match the container's. A forward of remote
        # 8080 onto local 8081 makes the Workflows button open this dashboard
        # again; the old probe could not see that, because a no-cors request is
        # opaque and any listener that answered read as healthy.
        #
        # Requirements that follow from that job:
        #   * auth_request off — the verdict must not depend on a valid session,
        #     or every gate reads "unreachable" to a logged-out browser.
        #   * Allow-Origin * — the probing page's own origin is unknowable here
        #     (it is whatever port the forward assigned), so the $cors_ok
        #     allowlist, pinned to :8080, would reject the very case being
        #     diagnosed. Safe because the response is a fixed public constant:
        #     no secrets, no session, and credentials:'omit' on the caller (a
        #     wildcard origin and credentials are mutually exclusive anyway).
        #   * logged — the healthcheck noise that justifies `access_log off` on
        #     /healthz does not touch this path, and a probe that lands on the
        #     wrong port must leave a trace to be diagnosable at all.
        # A plain GET with no custom headers is a CORS-simple request, so no
        # OPTIONS preflight handler is needed.
        location = /_spotter/gate {
            auth_request off;
            default_type application/json;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Cache-Control "no-store" always;
            return 200 '{"gate":"portal","port":8080,"label":"SPOTTER dashboard"}';
        }

        # Carries the Caddy vhost hostnames/port to frontend/index.html's GATES
        # object, so the Workflows/Graph quick-launch links follow whatever this
        # install's SPOTTER_N8N_HOST/SPOTTER_GRAPH_HOST/SPOTTER_CADDY_PORT actually
        # are, rather than the compiled-in defaults. Same envsubst mechanism as
        # the CORS/login-redirect values above -- generated, never edited.
        location = /config.js {
            auth_request off;
            default_type application/javascript;
            add_header Cache-Control "no-store" always;
            return 200 'window.SPOTTER_GATES={"n8nHost":"${SPOTTER_N8N_HOST}","graphHost":"${SPOTTER_GRAPH_HOST}","chatHost":"${SPOTTER_CHAT_HOST}","caddyPort":"${SPOTTER_CADDY_PORT}"};';
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Web screenshots captured by EyeWitness ingest (WF06). Served from the
        # shared bind mount the n8n runners write to. NO `auth_request off` here —
        # this block inherits the gate above ON PURPOSE: screenshots are client
        # engagement data and must sit behind the session cookie, same as the graph.
        # A missing file 404s instead of falling through to the SPA's index.html.
        location /screenshots/ {
            alias /usr/share/nginx/screens/;
            try_files $uri =404;
            autoindex off;
            add_header Cache-Control "private, max-age=60" always;
            add_header X-Content-Type-Options nosniff always;
        }

        # Chunked ingest. One request is one chunk, never the file. Inherits
        # auth_request from this server block. X-Spotter-User is overwritten so
        # the sidecar trusts the session, not a client-supplied header. The
        # http-level proxy_send_timeout is 60s, which is tight for a 16 MB
        # chunk over the managed tunnel, so this location overrides it.
        location /ingest/ {
            client_max_body_size 32m;
            client_body_timeout 120s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_request_buffering off;

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin      $cors_ok;
                add_header Access-Control-Allow-Methods     "GET, POST, PATCH, OPTIONS";
                add_header Access-Control-Allow-Headers     "Content-Type, Upload-Offset";
                add_header Access-Control-Allow-Credentials "true";
                add_header Content-Length 0;
                return 204;
            }

            set $ingest_up http://spotter-ingest:7053;
            proxy_pass         $ingest_up$request_uri;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Spotter-User    $spotter_user;
            proxy_set_header   X-Spotter-Admin   $spotter_admin;

            proxy_hide_header  Access-Control-Allow-Origin;
            proxy_hide_header  Access-Control-Allow-Methods;
            proxy_hide_header  Access-Control-Allow-Headers;

            add_header Access-Control-Allow-Origin      $cors_ok always;
            add_header Access-Control-Allow-Methods     "GET, POST, PATCH, OPTIONS" always;
            add_header Access-Control-Allow-Headers     "Content-Type, Upload-Offset" always;
            add_header Access-Control-Allow-Credentials "true" always;
        }

        # Proxy n8n production webhooks — avoids browser CORS preflight to n8n:5678
        location /webhook/ {
            # OPTIONS preflight must include all CORS headers directly in the if block —
            # nginx's if{} add_header replaces parent-block add_header, not appends to it.
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin      $cors_ok;
                add_header Access-Control-Allow-Methods     "GET, POST, OPTIONS";
                add_header Access-Control-Allow-Headers     "Content-Type";
                add_header Access-Control-Allow-Credentials "true";
                add_header Content-Length 0;
                return 204;
            }

            set $n8n_up http://n8n:5678;
            proxy_pass         $n8n_up$request_uri;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Spotter-User    $spotter_user;
            proxy_set_header   X-Spotter-Admin   $spotter_admin;

            proxy_hide_header  Access-Control-Allow-Origin;
            proxy_hide_header  Access-Control-Allow-Methods;
            proxy_hide_header  Access-Control-Allow-Headers;

            # Allow-Credentials is required because the SPA sends the session
            # cookie with credentials:'include' — without it the browser discards
            # even a successful cross-origin response when s.bu points elsewhere.
            add_header Access-Control-Allow-Origin      $cors_ok always;
            add_header Access-Control-Allow-Methods     "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers     "Content-Type" always;
            add_header Access-Control-Allow-Credentials "true" always;
        }

        # Proxy n8n test webhooks (workflow not yet activated)
        location /webhook-test/ {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin      $cors_ok;
                add_header Access-Control-Allow-Methods     "GET, POST, OPTIONS";
                add_header Access-Control-Allow-Headers     "Content-Type";
                add_header Access-Control-Allow-Credentials "true";
                add_header Content-Length 0;
                return 204;
            }

            set $n8n_up http://n8n:5678;
            proxy_pass         $n8n_up$request_uri;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Spotter-User    $spotter_user;
            proxy_set_header   X-Spotter-Admin   $spotter_admin;

            proxy_hide_header  Access-Control-Allow-Origin;
            proxy_hide_header  Access-Control-Allow-Methods;
            proxy_hide_header  Access-Control-Allow-Headers;

            add_header Access-Control-Allow-Origin      $cors_ok always;
            add_header Access-Control-Allow-Methods     "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers     "Content-Type" always;
            add_header Access-Control-Allow-Credentials "true" always;
        }

        # Managed SSH tunnel control-plane for Infrastructure tab.
        # Reads (GET/HEAD) stay available to any signed-in operator so the
        # Infrastructure tab can show egress status. Writes — start, stop, key
        # upload — are administrator-only. Opening registration without this
        # would let every approved account drive the tunnel.
        location /infra/tunnel/ {
            set $tunnel_deny "";
            if ($spotter_admin != "1") { set $tunnel_deny "1"; }
            if ($request_method = GET)  { set $tunnel_deny ""; }
            if ($request_method = HEAD) { set $tunnel_deny ""; }
            if ($tunnel_deny = "1") { return 403; }

            set $tunnel_up http://ssh-tunnel-api:7060;
            rewrite ^/infra(/tunnel/.*)$ $1 break;
            proxy_pass         $tunnel_up;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # The shared secret is injected HERE, not typed into the browser.
            # ${TUNNEL_API_TOKEN} is substituted at container start by the nginx
            # image's envsubst entrypoint (this file is mounted as
            # /etc/nginx/templates/nginx.conf.template, with
            # NGINX_ENVSUBST_FILTER pinned to that one name so every nginx
            # $variable below survives untouched). Consequences worth knowing:
            #
            #   * proxy_set_header OVERWRITES a client-supplied header, so a
            #     browser cannot influence or spoof this value;
            #   * the secret exists only in the generated config inside the
            #     container — never in this repo file, never in localStorage;
            #   * an empty TUNNEL_API_TOKEN sends an empty header, which the
            #     sidecar then falls back to Authorization for. That is the
            #     unconfigured case and it 401s, which is the correct outcome.
            proxy_set_header   X-Tunnel-Token    "${TUNNEL_API_TOKEN}";
            proxy_set_header   Authorization      $http_authorization;
            proxy_set_header   X-Spotter-User    $spotter_user;
            proxy_set_header   X-Spotter-Admin   $spotter_admin;
            proxy_read_timeout 30s;
            # Key upload posts a base64 private key, which is kilobytes. Without
            # this the block inherits the 128m set at the http level for ingest,
            # aiming a 128 MB body at a SINGLE-worker Flask process. The sidecar
            # caps the key itself (TUNNEL_MAX_KEY_BYTES); this stops an oversize
            # body ever reaching it.
            client_max_body_size 256k;
        }
    }

    # ══════════════════════════════════════════════════════════════════════════
    # :8081 — n8n editor, behind the same session cookie
    #
    # Proxied at the server root (not a subpath) so n8n needs no N8N_PATH change
    # and its existing /webhook/ URLs keep working untouched. Cookies ignore the
    # port number, so one login at :8080 already covers this — provided the same
    # hostname is used (localhost and 127.0.0.1 are distinct cookie hosts).
    # ══════════════════════════════════════════════════════════════════════════
    server {
        listen 8081;
        server_name _;

        auth_request     /_auth/verify;
        auth_request_set $spotter_user $upstream_http_x_spotter_user;
        error_page 401 = @unauthorized;

        location @unauthorized {
            if ($wants_html) {
                return 302 https://${SPOTTER_DASHBOARD_HOST}:${SPOTTER_CADDY_PORT}/login.html;
            }
            default_type application/json;
            return 401 '{"error":"unauthenticated"}';
        }

        location = /_auth/verify {
            internal;
            auth_request off;
            set $auth_up http://spotter-auth:7052;
            proxy_pass              $auth_up/auth/verify;
            proxy_pass_request_body off;
            proxy_set_header        Content-Length "";
            proxy_set_header        X-Original-URI $request_uri;
        }

        # Identity of this port — see the :8080 block for why it is unauthenticated
        # and wildcard-CORS. Exact-match, so it shadows the n8n proxy below and
        # never reaches n8n (which has no such route).
        location = /_spotter/gate {
            auth_request off;
            default_type application/json;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Cache-Control "no-store" always;
            return 200 '{"gate":"n8n","port":8081,"label":"n8n editor"}';
        }

        location / {
            set $n8n_up http://n8n:5678;
            proxy_pass         $n8n_up$request_uri;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }

    # ══════════════════════════════════════════════════════════════════════════
    # :8082 — Flowsint graph app, behind the same session cookie
    #
    # The app image runs its own nginx on 8080 which proxies /api/ to
    # flowsint-api, so proxying the root here is sufficient. Flowsint keeps its
    # own login (separate identity system), so this is a second gate in front of
    # it, not a replacement for it.
    # ══════════════════════════════════════════════════════════════════════════
    server {
        listen 8082;
        server_name _;

        auth_request     /_auth/verify;
        auth_request_set $spotter_user $upstream_http_x_spotter_user;
        error_page 401 = @unauthorized;

        location @unauthorized {
            if ($wants_html) {
                return 302 https://${SPOTTER_DASHBOARD_HOST}:${SPOTTER_CADDY_PORT}/login.html;
            }
            default_type application/json;
            return 401 '{"error":"unauthenticated"}';
        }

        location = /_auth/verify {
            internal;
            auth_request off;
            set $auth_up http://spotter-auth:7052;
            proxy_pass              $auth_up/auth/verify;
            proxy_pass_request_body off;
            proxy_set_header        Content-Length "";
            proxy_set_header        X-Original-URI $request_uri;
        }

        # Identity of this port — see the :8080 block. Exact-match, so it shadows
        # the Flowsint app proxy below.
        location = /_spotter/gate {
            auth_request off;
            default_type application/json;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Cache-Control "no-store" always;
            return 200 '{"gate":"flowsint","port":8082,"label":"Flowsint graph"}';
        }

        location / {
            set $app_up http://app:8080;
            proxy_pass         $app_up$request_uri;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }

    # ══════════════════════════════════════════════════════════════════════════
    # :8083 — Open WebUI chat, reached at the Caddy vhost chat.spotter.localhost
    #
    # Open WebUI publishes 127.0.0.1:3000 on the docker HOST for host-side callers
    # (scripts/setup_openwebui.py, smoke_deploy.py). That port is not part of the
    # front door, so the dashboard's Chat link — which pointed straight at it —
    # opened a tab with nothing behind it for every operator whose browser reaches
    # SPOTTER through the single forwarded 5443. This block is that link's target.
    #
    # NO auth_request, and unlike :8099 that is not a compromise:
    #
    #   * Open WebUI runs with WEBUI_AUTH=true and has its own accounts. Every
    #     route here already requires its bearer token or session; this is not an
    #     open surface being placed on the front door.
    #   * The Prompt tab (frontend/index.html) calls /api/models, /api/chat/completions
    #     and /api/v1/auths/signin on this origin CROSS-ORIGIN from the dashboard
    #     vhost, authenticating with an Authorization: Bearer header and no cookie.
    #     Putting the session gate here would 401 every one of those XHRs, and
    #     fixing that means credentialed CORS — Allow-Credentials with a reflected
    #     origin, plus a preflight handler for the Authorization header — i.e.
    #     relaxing the gate for the one caller it would otherwise block. The
    #     session cookie is SameSite=Lax, so it is not sent on those cross-site
    #     XHRs in the first place.
    #
    # Websockets matter here: Open WebUI streams chat over socket.io, and without
    # the Upgrade/Connection pair below the UI loads and then hangs on first send.
    # ══════════════════════════════════════════════════════════════════════════
    server {
        listen 8083;
        server_name _;

        # Identity of this port — see the :8080 block for why it is unauthenticated
        # and wildcard-CORS. Exact-match, so it shadows the proxy below and never
        # reaches Open WebUI (which has no such route and would 404 it into the SPA).
        location = /_spotter/gate {
            default_type application/json;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Cache-Control "no-store" always;
            return 200 '{"gate":"open-webui","port":8083,"label":"Open WebUI chat"}';
        }

        location / {
            set $owui_up http://open-webui:8080;
            proxy_pass         $owui_up$request_uri;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Token streaming. Open WebUI sends SSE, and nginx's default response
            # buffering would hold a turn back until it completed — the whole
            # point of the Prompt tab's streaming path (see sendChat) is lost.
            proxy_buffering off;
        }
    }

    # ══════════════════════════════════════════════════════════════════════════
    # :8099 — Brute Ratel C4 listener webhook ingress (workflow 21)
    #
    # Without the auth_request gate, and deliberately so (:8083 is the other one,
    # but that one fronts a service with its own mandatory login; this one is
    # genuinely unauthenticated at the HTTP layer):
    # BRc4's webhook dialog offers one URL field and no header controls, so a
    # listener can never present the session cookie every other port requires.
    # A cookie-less POST to /webhook/brute-ratel on :8080 gets a 401, which is
    # why the URL documented in .env.example never worked from Commander.
    #
    # What replaces the cookie: this port is bound to 127.0.0.1 in compose and
    # reached only through an operator-held `ssh -L` from the Ratel server, and
    # the shared secret on ?t= (BRC4_WEBHOOK_TOKEN) is checked inside WF21's
    # Normalise node, which answers a wrong or missing token with event
    # 'rejected' and ingests nothing.
    #
    # PLAIN HTTP: TLS now terminates at Caddy (deployment/Caddyfile), pinned to
    # the literal loopback IP because BRc4's webhook dialog takes only a bare
    # scheme://host:port. Caddy → nginx crosses the docker network unencrypted,
    # same as every other spotter-ui upstream hop.
    # ══════════════════════════════════════════════════════════════════════════
    server {
        listen 8099;
        server_name _;

        # Overrides the http-level access_log: the default format would print the
        # ?t= secret on every check-in. See the brc4 format above.
        access_log /var/log/nginx/access.log brc4;

        # Base64 command output, not a SharpHound upload. The http-level 128m
        # is far more than this endpoint has any reason to accept.
        client_max_body_size 8m;

        # Identity of this port -- see the :8080 block. Also the cheapest way to
        # prove the ssh -L forward reaches THIS port and not a shifted sibling.
        location = /_spotter/gate {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            return 200 '{"gate":"brc4","port":8099,"label":"Brute Ratel ingress"}';
        }

        # BRc4's webhook dialog takes a host:port (the manual's example URL has
        # no path), so the path it POSTs to is not ours to choose. Every POST on
        # this port therefore maps to the one workflow.
        location / {
            limit_except POST { deny all; }
            error_page 403 = @brc4_wrong_method;

            set $n8n_up http://n8n:5678;
            proxy_pass         $n8n_up/webhook/brute-ratel$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Blanked, NOT forwarded. Every other port derives these from the
            # auth subrequest, and the code nodes trust them precisely because
            # proxy_set_header always overwrites. This port has no subrequest,
            # so they must be overwritten with empty rather than left to pass a
            # client-supplied value through to n8n.
            proxy_set_header   X-Spotter-User    "";
            proxy_set_header   X-Spotter-Admin   "";
        }

        # A browser GET/HEAD here is an operator who landed on the bare IP by
        # mistake (see the Caddyfile), not a check-in -- send them to the real
        # dashboard instead of a bare 403. `if` can't live in the location above
        # (it fights limit_except's own phase there), so it's caught via
        # error_page and re-checked here instead, in a location of its own.
        location @brc4_wrong_method {
            if ($request_method ~ ^(GET|HEAD)$) {
                return 302 https://${SPOTTER_DASHBOARD_HOST}:${SPOTTER_CADDY_PORT}/;
            }
            return 403;
        }
    }
}
