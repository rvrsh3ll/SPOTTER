<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SPOTTER — Request access</title>
<script>
  try {
    var t = localStorage.getItem('s.theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
<style>
  :root {
    --bg:#0b0f14; --panel:#111821; --line:#1e2a37; --fg:#d7e2ee; --muted:#7d8fa3;
    --accent:#4da3ff; --err:#ff6b6b; --ok:#7dcea0; --shadow:0 18px 50px rgba(0,0,0,.45);
  }
  :root[data-theme="light"] {
    --bg:#eef2f6; --panel:#ffffff; --line:#d3dce5; --fg:#16202b; --muted:#5c6b7c;
    --accent:#0b6bcb; --err:#c0392b; --ok:#1e7f4f; --shadow:0 18px 50px rgba(16,32,48,.13);
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0; background:var(--bg); color:var(--fg);
    font:14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card {
    width:100%; max-width:380px; background:var(--panel);
    border:1px solid var(--line); border-radius:10px; padding:28px;
    box-shadow:var(--shadow);
  }
  .brand { font-size:22px; font-weight:700; letter-spacing:.32em; margin:0 0 4px; }
  .brand span { color:var(--accent); }
  .tag { color:var(--muted); font-size:11px; letter-spacing:.16em; margin:0 0 16px; }
  .hint { color:var(--muted); font-size:11px; line-height:1.6; margin:0 0 18px; }
  label { display:block; font-size:11px; letter-spacing:.12em; color:var(--muted); margin:0 0 6px; }
  input {
    width:100%; padding:10px 12px; margin:0 0 16px; background:var(--bg);
    border:1px solid var(--line); border-radius:6px; color:var(--fg);
    font:inherit; outline:none;
  }
  input:focus { border-color:var(--accent); }
  button {
    width:100%; padding:11px; border:0; border-radius:6px; background:var(--accent);
    color:#fff; font:inherit; font-weight:700; letter-spacing:.12em; cursor:pointer;
  }
  button:disabled { opacity:.55; cursor:default; }
  .msg {
    margin:16px 0 0; padding:10px 12px; border-radius:6px; font-size:12px;
    background:rgba(255,107,107,.1); border:1px solid var(--err); color:var(--err);
    display:none; word-break:break-word;
  }
  .msg.on { display:block; }
  .msg.ok { background:rgba(125,206,160,.1); border-color:var(--ok); color:var(--ok); }
  .foot { margin:22px 0 0; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:11px; }
  .foot a { color:var(--accent); }
</style>

<form class="card" id="form" autocomplete="on">
  <h1 class="brand">SPOT<span>TER</span></h1>
  <p class="tag">AUTHORIZED ENGAGEMENT — REQUEST ACCESS</p>
  <p class="hint">This does not sign you in. An administrator has to approve the account. The reply is the same whether or not the username is already taken.</p>

  <label for="u">OPERATOR</label>
  <input id="u" name="username" autocomplete="username" autocapitalize="none"
         autocorrect="off" spellcheck="false" required autofocus>

  <label for="p">PASSWORD</label>
  <input id="p" name="password" type="password" autocomplete="new-password" required minlength="8">

  <button id="go" type="submit">REQUEST ACCESS</button>
  <p class="msg" id="msg" role="status"></p>

  <p class="foot"><a href="/login.html">Back to sign in</a></p>
</form>

<script>
  const form = document.getElementById('form');
  const msgEl = document.getElementById('msg');
  const btn = document.getElementById('go');

  function show(text, ok) {
    msgEl.textContent = text;
    msgEl.classList.add('on');
    msgEl.classList.toggle('ok', !!ok);
    btn.disabled = false;
    btn.textContent = 'REQUEST ACCESS';
  }

  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    msgEl.classList.remove('on', 'ok');
    btn.disabled = true;
    btn.textContent = 'SENDING…';
    try {
      const res = await fetch('/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('u').value.trim(),
          password: document.getElementById('p').value,
        }),
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok) {
        show(data.message || 'Request recorded. An administrator must approve it.', true);
        form.reset();
        return;
      }
      show(data.error || 'Could not submit the request.');
    } catch (e) {
      show('Cannot reach the authentication service: ' + e.message);
    }
  });
</script>
